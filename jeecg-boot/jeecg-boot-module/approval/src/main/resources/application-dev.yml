server:
  port: 8081
  tomcat:
    max-swallow-size: -1
  error:
    include-exception: true
    include-stacktrace: ALWAYS
    include-message: ALWAYS
  servlet:
    context-path: /approval-boot
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/javascript,application/json,application/xml,text/html,text/xml,text/plain,text/css,image/*

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/jeecg-boot?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          username: root
          password: 1234
          driver-class-name: com.mysql.cj.jdbc.Driver
        superset:
          url: jdbc:sqlite:E:/superset_home/superset.db
          driver-class-name: org.sqlite.JDBC
      druid:
        initial-size: 5
        min-idle: 5
        max-active: 20
        max-wait: 60000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        filters: stat,wall
        connection-properties:
          druid.stat.mergeSql: "true"
          druid.stat.slowSqlMillis: "5000"

#  redis:
#    database: 0
#    host: 127.0.0.1
#    port: 6379
#    password: ''
#    timeout: 10000ms
#    lettuce:
#      pool:
#        max-active: 8
#        max-wait: -1ms
#        max-idle: 8
#        min-idle: 0
  #json 时间戳统一转换
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  jpa:
    open-in-view: false
  aop:
    proxy-target-class: true
  autoconfigure:
    exclude:
      - org.apache.shiro.spring.boot.autoconfigure.ShiroAutoConfiguration
      - org.apache.shiro.spring.config.web.autoconfigure.ShiroWebAutoConfiguration
      - org.apache.shiro.spring.config.web.autoconfigure.ShiroWebFilterConfiguration
      - org.apache.shiro.spring.boot.autoconfigure.ShiroBeanAutoConfiguration
      - org.apache.shiro.spring.boot.autoconfigure.ShiroAnnotationProcessorAutoConfiguration

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: org/aihom/**/mapper/xml/*Mapper.xml
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: null
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Jeecg配置
jeecg:
  # 本地：local\Minio：minio\阿里云：alioss
  uploadType: local
  path:
    upload: /opt/upFiles
    webapp: /opt/webapp
  shiro:
    excludeUrls: /test/jeecgDemo/demo3,/test/jeecgDemo/redisDemo/**,/category/**,/visual/**,/map/**,/jmreport/bigscreen2/**
  # 签名密钥串(前后端要一致，正式发布请自行修改)
  signatureSecret: dd05f1c54d63749eda95f9fa6d49v442a
  # 本地文件预览地址
  domainUrl:
    pc: http://localhost:3100
    app: http://localhost:8051

# Swagger配置
knife4j:
  enable: true
  production: false
  basic:
    enable: false
    username: jeecg
    password: jeecg1314

# 日志配置
logging:
  level:
    root: info
    org.aihom: debug
    org.jeecg: info
    org.springframework: warn

# LiteFlow 配置
liteflow:
  enable: false
  print-banner: false

# JimuReport 配置
jmreport:
  print-banner: false

superset:
  url: http://localhost:8088
